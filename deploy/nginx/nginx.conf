user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    #
    # Le qr_token véhicule (URL chauffeur /v/<hex32>) est une clé d'auth
    # physique : on le masque dans les access logs pour qu'il n'apparaisse
    # jamais dans /var/log/nginx/access.log ni dans les agrégateurs.
    # Ne pas remplacer manuellement — ce map gère le redact automatiquement.
    map $request_uri $redacted_request_uri {
        "~^(?<prefix>/v/)[a-f0-9]{32}(?<rest>.*)$" "${prefix}REDACTED${rest}";
        default                                    $request_uri;
    }

    # $host = domaine réellement demandé. Sans lui, impossible de distinguer
    # dans les journaux une requête vers solidata.online d'une requête vers
    # m.solidata.online — les deux résolvent vers la même adresse et arrivent
    # sur le même nginx. Ce manque a coûté un diagnostic entier le 24/08/2026 :
    # un chauffeur ne joignait plus l'application mobile alors que le site web
    # répondait, et rien dans les logs ne permettait de le voir.
    log_format main '$remote_addr - $remote_user [$time_local] $host '
                    '"$request_method $redacted_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}
