# Résolution DNS au moment de la requête (évite "host not found" au démarrage)
resolver 127.0.0.11 valid=10s ipv6=off;

# === HTTP → HTTPS redirect ===
server {
    listen 80;
    server_name solidata.online www.solidata.online m.solidata.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# === MAIN APP — solidata.online ===
server {
    listen 443 ssl;
    http2 on;
    server_name solidata.online www.solidata.online;

    ssl_certificate /etc/letsencrypt/live/solidata.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solidata.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # CSP renforcée (T1.2 audit) — voir CLAUDE.md changelog.
    add_header Content-Security-Policy "default-src 'self'; frame-src 'self' blob:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' wss: ws:; frame-ancestors 'self';" always;

    set $frontend_upstream "frontend:80";
    set $backend_upstream "backend:3001";

    # ── Réponses de maintenance ───────────────────────────────────────────
    # `error_page 503 @nom` SANS le signe « = » : le code 503 est CONSERVÉ.
    # Avec « = », nginx renverrait 200 et un moteur de recherche indexerait la
    # page de maintenance à la place de l'application.
    error_page 503 @maintenance;

    # Aux navigateurs : la page. `internal` la rend inatteignable directement.
    location @maintenance {
        internal;
        root /etc/nginx/maintenance;
        default_type text/html;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /maintenance.html =503;
    }

    # Aux applications : du JSON. Le web et le mobile attendent du JSON ; leur
    # servir du HTML produirait une erreur d'analyse au lieu d'un message. La
    # clé `error` est celle qu'emploie déjà tout le backend, si bien que les
    # bandeaux d'erreur existants affichent ce texte sans une ligne de code.
    location @maintenance_api {
        internal;
        default_type application/json;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"SOLIDATA est en cours de mise à jour. Merci de réessayer dans quelques minutes.","code":"MAINTENANCE"}';
    }

    location / {
        include /etc/nginx/conf.d/maintenance-garde.inc;
        proxy_pass http://$frontend_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        include /etc/nginx/conf.d/maintenance-garde.inc;
        error_page 503 @maintenance_api;
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/auth/login {
        include /etc/nginx/conf.d/maintenance-garde.inc;
        error_page 503 @maintenance_api;
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        include /etc/nginx/conf.d/maintenance-garde.inc;
        error_page 503 @maintenance_api;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    location ^~ /uploads/ {
        include /etc/nginx/conf.d/maintenance-garde.inc;
        error_page 503 @maintenance_api;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ATTENTION — en nginx, une règle par expression régulière l'emporte sur une
    # règle par préfixe. Sans le « ^~ » posé sur /api/ et /uploads/ ci-dessus,
    # toute URL finissant par .jpg (une photo de CAV, une photo d'incident)
    # était captée ici et servie par le conteneur de fichiers statiques, qui
    # répondait sa page d'accueil en 200. Le navigateur recevait du HTML dans
    # une balise <img> : image cassée, sans aucune erreur visible.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        include /etc/nginx/conf.d/maintenance-garde.inc;
        proxy_pass http://$frontend_upstream;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

